# @gavinc-cn/dsh-plugins-runtime —— 「运行时组件」的组合行（2026-10-13 从 @gavinc-cn/dsh-plugins 拆出）。
#
# 归属判据（2026-10-15 修订）：**宿主侧的运行支撑组件归本包**（记忆、守卫、沙箱白名单…）。
# 判据是「面向谁」而不是「代码跑在哪」—— 面向 Web GUI 的组件（含实现落在宿主侧的
# dsh-patch-ask-expand）都在 @gavinc-cn/dsh-plugins-ui 里。本包组件的 package.json 里都没有
# `dsh.client` 声明，两个包合起来 = 拆分时（2026-10-13）@gavinc-cn/dsh-plugins 的 13 个组件里
# 仍在 bundle 内的 12 个，行 id 与行顺序保持不变（当前为 13 行，见本文件各行与演进注释）。
#
# 2026-10-15：**dsh-patch-ask-expand 已移到 @gavinc-cn/dsh-plugins-ui**。它没有 `dsh.client`、
# 运行体确实在宿主侧，但用户视角里它是个纯粹的 GUI 观感功能（提问行默认展开）⇒ 按「面向谁」
# 归 UI bundle，避免「只想装 UI 包的人发现不了它」。判据全文见 doc_ai/plan/202610/20261015_0546_ask-expand-to-ui-bundle.md。
#
# 工作方式（与拆分前一致）：
#   * Plugins 面板出现 @gavinc-cn/dsh-plugins-runtime 卡片，卡片内每个行 = 一个组件 = 一个开关；
#   * 行开关写回 profile patch 的 `- id: <行id>` 覆盖行（行状态留在各 profile，可各自独立开关）；
#   * 整包开关控制包名在不在 profile 的 dsh.profile.bundles。
#
# 行 id 与包名的约定：id = 包名去掉 scope（@gavinc-cn/dsh-memory → dsh-memory），
# name 才是模块说明符（= 完整包名）。
#
# **同一个行 id 在整棵组合树里只能出现一次**：写进本文件的行，profile 侧不要再写同名 insert
# （同 id 两行会被 dsh-plugin-manager 的 listPlugins() 判成 unaddressable，面板里既没有开关
# 也拨不动），只写不带 insert 的覆盖行。
#
# 机器相关配置（本机检出路径、状态目录、日志路径）**不进本文件**：写在各 profile 的覆盖行里，
# 例如 `- id: dsh-superpowers-priming` + `config: { skillPath: ... }`。
#
# 依赖：本包在 package.json 的 dependencies 里声明下述 8 个组件包 —— 装本包即把它们一并装上。
# 发布顺序：**8 个组件包先发，本包最后发**。组件之间也有顺序：@gavinc-cn/dsh-write-guard 依赖
# @gavinc-cn/dsh-path-rules 的 subpath exports，故 path-rules（0.1.3）→ write-guard → 本包
# （dsh-plugins-runtime）依次发。
# （2026-10-24 前本包还依赖 @gavinc-cn/dsh-readonly-guard；该组件已退役，见下方退役注释。）
#
# 改组件集合 = 改本文件（patch 层 live 热重载，不需要重装/重启）；改完把仓库真源铺到共享活副本
# （在仓库根执行：bash scripts/deploy-to-dsh.sh dsh-plugins-runtime）。
#
# 注意：别再对 profile 跑 pnpm install —— registry 版会盖住共享活副本里那份（见仓库 README）。

- insert:
    - id: dsh-superpowers-priming
      name: "@gavinc-cn/dsh-superpowers-priming"

- insert:
    - id: dsh-memory
      name: "@gavinc-cn/dsh-memory"

- insert:
    - id: dsh-autocommit
      name: "@gavinc-cn/dsh-autocommit"

- insert:
    - id: dsh-git-guard
      name: "@gavinc-cn/dsh-git-guard"

- insert:
    - id: dsh-file-guard
      name: "@gavinc-cn/dsh-file-guard"

# sandbox-path-allowlist：2026-10-17 由 dsh-path-rules **合并退役**，行与依赖已移除（白名单能力由
# dsh-path-rules 的 approval/request 监听等价承接，见该包的 spec §2.6 / §4.4）。
# 组件包本体仍留在仓库 packages/runtime/sandbox-path-allowlist/（回滚时把本 insert 行 + 依赖 +
# profile 覆盖行挂回即可，spec §8 回滚 3）；「有包、没进 bundle」由 scripts/check-bundles.mjs 的
# UNBUNDLED 显式登记。

# dsh-readonly-guard：2026-10-24 **退役**，行与 dependencies 已移除。
# 它是 kimi-code `readonly_guard.py` 的移植版 bash 只读闸门（不认预设身份，包内默认停用）；
# 退役理由：本仓库 6 个档位里已没有它的位置——第 6 档由 dsh-write-guard 按**写入目标**判定、
# 第 5 档由 dsh-path-rules 判定（都更精准），原生档由沙箱负责；且它判「非只读」时不调用
# next()，会短路其后注册的闸门（bug 工单 20261024_1305）。2026-10-24 实测两个 profile 均未
# 启用它、日志 12 次加载 0 次决策 ⇒ 退役对现网零影响。
# 组件包本体仍留在仓库 packages/runtime/dsh-readonly-guard/ 作回滚真源（回滚 = 把本 insert 行 +
# dependencies + profile 覆盖行挂回，并从 scripts/check-bundles.mjs 的 UNBUNDLED 删掉登记）；
# 「有包、没进 bundle」由该脚本的 UNBUNDLED 显式登记。

# dsh-path-rules：第五权限模式「路径规则」的逐调用闸门（项目内可读写 / 项目外写需审批 /
# 白名单直通 / 黑名单读写都审批 / bash·pwsh 只读放行）。包内默认无白/黑名单 = 安全空转，
# 且只在预设身份为 `path-rules` 时介入 ⇒ 不选中该档时对既有五档零影响。
# 白/黑名单等机器相关配置由各 profile 的覆盖行给。
- insert:
    - id: dsh-path-rules
      name: "@gavinc-cn/dsh-path-rules"

# dsh-write-guard：第六权限模式「完全权限（拦截）」的逐调用写入闸门（只在预设身份
# write-guard 时介入；读/项目内/白名单写直通，越界写弹框并自动学习白名单，判不出的 shell
# 交当前会话模型判定）。未选中该档时对既有档位零影响；插件停用 = 完全不拦截。
- insert:
    - id: dsh-write-guard
      name: "@gavinc-cn/dsh-write-guard"

# dsh-sandbox-whitelist：多根沙箱 provider（方案 C）——顶替官方 `- id: sandbox` 行，把
# 「项目根 + 白名单根 + 临时区」变成执行层可写根，其余只读：Linux 用内核级 bwrap/Landlock，
# Windows 用官方 windows-acl 受限令牌（给白名单目录补 workspace 写 SID 的 standing ACE）。
# **默认停用**：启用必须同时把官方 `- id: sandbox` 行停用（同名 service 只能有一个 provider），
# 否则两个 provider 抢注册（先注册者赢、另一个 fiber 失败）。只对 `enforcePresets` 命中的会话
# 追加白名单根，其余预设保持官方语义；macOS 未实现 ⇒ apply 期拒绝加载，不要在 macOS profile 打开。
- insert:
    - id: dsh-sandbox-whitelist
      disabled: true
      name: "@gavinc-cn/dsh-sandbox-whitelist"

# dsh-fs-whitelist：fs provider 替换件（`write`/`edit` 的白名单根）——顶替官方
# `- id: fs-sandbox`，把「白名单 + 自动白名单」目录接进 fs fence 的可写根。这是 trusted-code
# 的策略判定、不是内核边界（shell 的内核根见上一行 dsh-sandbox-whitelist）。**默认停用**：
# 启用必须同时把官方 `- id: fs-sandbox` 行停用（同名 service `fs` 只能有一个 provider），
# 否则两个 provider 抢注册（先注册者赢、另一个 fiber 失败）。只对 `enforcePresets` 命中的
# 会话追加白名单根，其余预设保持官方单根语义；跨平台（Windows 走大小写不敏感的词法判定）。
# 停用必须成对恢复官方 `- id: fs-sandbox`，否则 ctx.fs 缺失会让 read/read_image/write/edit
# 四个工具一起消失。
- insert:
    - id: dsh-fs-whitelist
      disabled: true
      name: "@gavinc-cn/dsh-fs-whitelist"
