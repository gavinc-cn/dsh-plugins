# @gavinc-cn/dsh-plugins-runtime —— 「运行时组件」的组合行（2026-10-13 从 @gavinc-cn/dsh-plugins 拆出）。
#
# 归属判据（2026-10-15 修订）：**宿主侧的运行支撑组件归本包**（记忆、守卫、只读闸门、沙箱白名单…）。
# 判据是「面向谁」而不是「代码跑在哪」—— 面向 Web GUI 的组件（含实现落在宿主侧的
# dsh-patch-ask-expand）都在 @gavinc-cn/dsh-plugins-ui 里。本包组件的 package.json 里都没有
# `dsh.client` 声明，两个包合起来 = 拆分前 @gavinc-cn/dsh-plugins 的 13 个组件里
# 仍在 bundle 内的 12 个，行 id 与行顺序都保持不变。
#
# 2026-10-15：**dsh-patch-ask-expand 已移到 @gavinc-cn/dsh-plugins-ui**。它没有 `dsh.client`、
# 运行体确实在宿主侧，但用户视角里它是个纯粹的 GUI 观感功能（提问行默认展开）⇒ 按「面向谁」
# 归 UI bundle，避免「只想装 UI 包的人发现不了它」。判据全文见 docs/plan-2026-10-15-ask-expand-to-ui-bundle.md。
#
# 工作方式（与拆分前一致）：
#   * Plugins 面板出现 @gavinc-cn/dsh-plugins-runtime 卡片，卡片内每个行 = 一个组件 = 一个开关；
#   * 行开关写回 profile patch 的 `- id: <行id>` 覆盖行（行状态留在各 profile，可各自独立开关）；
#   * 整包开关控制包名在不在 profile 的 dsh.profile.bundles。
#
# 行 id 与包名的约定：id = 包名去掉 scope（@gavinc-cn/dsh-memory → dsh-memory），
# name 才是模块说明符（= 完整包名）。
#
# **同一个行 id 在整棵组合树里只能出现一次**：写进本文件的行，profile 侧不要再写同名 insert
# （同 id 两行会被 dsh-plugin-manager 的 listPlugins() 判成 unaddressable，面板里既没有开关
# 也拨不动），只写不带 insert 的覆盖行。
#
# 机器相关配置（本机检出路径、状态目录、日志路径）**不进本文件**：写在各 profile 的覆盖行里，
# 例如 `- id: dsh-superpowers-priming` + `config: { skillPath: ... }`。
#
# 依赖：本包在 package.json 的 dependencies 里声明下述 7 个组件包 —— 装本包即把它们一并装上。
# 发布顺序：**7 个组件包先发（其中 @gavinc-cn/dsh-readonly-guard 必须先于本包上 registry），本包最后发**。
#
# 改组件集合 = 改本文件（patch 层 live 热重载，不需要重装/重启）；改完把仓库真源铺到共享活副本
# （在仓库根执行：bash scripts/deploy-to-dsh.sh dsh-plugins-runtime）。
#
# 注意：别再对 profile 跑 pnpm install —— registry 版会盖住共享活副本里那份（见仓库 README）。

- insert:
    - id: dsh-superpowers-priming
      name: "@gavinc-cn/dsh-superpowers-priming"

- insert:
    - id: dsh-memory
      name: "@gavinc-cn/dsh-memory"

- insert:
    - id: dsh-autocommit
      name: "@gavinc-cn/dsh-autocommit"

- insert:
    - id: dsh-git-guard
      name: "@gavinc-cn/dsh-git-guard"

- insert:
    - id: dsh-file-guard
      name: "@gavinc-cn/dsh-file-guard"

# sandbox-path-allowlist：2026-10-17 由 dsh-path-rules **合并退役**，行与依赖已移除（白名单能力由
# dsh-path-rules 的 approval/request 监听等价承接，见该包的 spec §2.6 / §4.4）。
# 组件包本体仍留在仓库 packages/runtime/sandbox-path-allowlist/（回滚时把本 insert 行 + 依赖 +
# profile 覆盖行挂回即可，spec §8 回滚 3）；「有包、没进 bundle」由 scripts/check-bundles.mjs 的
# UNBUNDLED 显式登记。

# dsh-readonly-guard：bash 只读闸门（非只读命令转到 DSH 原生审批）。默认**停用**：
# 容器 web 侧刻意不挂（与既有 sandbox/approval 分层重叠），宿主 desktop 侧由覆盖行
# `- id: dsh-readonly-guard` + `disabled: false` 打开（见 desktop 的 cordis.patch.yml）。
- insert:
    - id: dsh-readonly-guard
      disabled: true
      name: "@gavinc-cn/dsh-readonly-guard"

# dsh-path-rules：第五权限模式「路径规则」的逐调用闸门（项目内可读写 / 项目外写需审批 /
# 白名单直通 / 黑名单读写都审批 / bash·pwsh 只读放行）。包内默认无白/黑名单 = 安全空转，
# 且只在预设身份为 `path-rules` 时介入 ⇒ 不选中该档时对既有四档零影响。
# 白/黑名单等机器相关配置由各 profile 的覆盖行给。
- insert:
    - id: dsh-path-rules
      name: "@gavinc-cn/dsh-path-rules"
